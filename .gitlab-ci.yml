# Adaptation checks only. No registry, Pages, release, mirror or package uploads.
stages: [test]
frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm test
    - npm run test:build-scripts
    - node scripts/check-locales.mjs
    - node scripts/check-source-strings.mjs
    - npm run test:fatigue-probe
    - npm run build
    - npm run check:cloud-bundle
android:
  stage: test
  image: cimg/android:2026.08-node
  script:
    - for task_jdk in /usr/lib/jvm/*21*; do if [ -x "$task_jdk/bin/java" ]; then export JAVA_HOME="$task_jdk"; break; fi; done
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - test "$(java -version 2>&1 | head -1 | cut -d '"' -f2 | cut -d . -f1)" = 21
    - sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
    - cd frontend
    - npm ci
    - npm run build:mobile
    - npm run check:cloud-bundle
    - bash android/gradlew --no-daemon -p android assembleDebug
