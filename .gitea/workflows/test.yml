# Checks only; publishing requires a separately reviewed adapted channel.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:build-scripts
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run check:cloud-bundle
        working-directory: frontend
